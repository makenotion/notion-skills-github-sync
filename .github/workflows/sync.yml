name: Sync Notion skills

# Runs the Notion -> plugin marketplace sync on a schedule (and on demand).
# See CLAUDE.md ("GitHub Actions runbook") for how to run/watch this manually
# and how to rotate the secrets below.
# Reads Notion via the Skills Public API over plain HTTPS using
# NOTION_API_TOKEN, and pushes to GitHub via the Git Data API using a PAT with
# push access to the target repo. No CLI dependencies.
#
# Configuration comes from repo **variables** (Settings > Secrets and variables >
# Actions > Variables) — nothing non-secret is committed, so every team's copy of
# this repo is identical and `update` never conflicts.
#
#   SKILLS_GITHUB_REPO      - owner/name of the repo plugins are published to (required)
#   SKILLS_GITHUB_BRANCH    - branch to write (default: main)
#   NOTION_ENV              - prod (default) | dev | stg
#   SKILLS_DATA_SOURCE_ID   - recorded in plugin markers / updater guidance
#   GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL - commit identity (optional)
#
# GitHub rejects variable/secret names starting with GITHUB_, which is why the
# two repo settings are stored as SKILLS_GITHUB_* and mapped back below.
#
# Required repo secrets:
#   NOTION_API_TOKEN   - Notion API token with read access to the skills
#   GH_PUSH_TOKEN      - PAT / fine-grained token with contents:write on the
#                        target repo (the default GITHUB_TOKEN can't push to a
#                        different repo)

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: notion-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Warm runs are seconds. The ceiling is for a cold sync, which fetches one
    # archive per plugin (SYNC_CONCURRENCY at a time) before committing once —
    # if that gets killed partway there's no commit, so a too-low timeout means
    # a cold target never converges, on any number of retries.
    timeout-minutes: 45
    env:
      # Secrets
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
      # Configuration (repo variables)
      GITHUB_REPO: ${{ vars.SKILLS_GITHUB_REPO }}
      GITHUB_BRANCH: ${{ vars.SKILLS_GITHUB_BRANCH }}
      NOTION_ENV: ${{ vars.NOTION_ENV }}
      SKILLS_DATA_SOURCE_ID: ${{ vars.SKILLS_DATA_SOURCE_ID }}
      GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync
        run: bun run src/cli.ts sync
