name: Sync Notion skills

# Runs the Notion -> plugin marketplace sync on a schedule (and on demand).
# See CLAUDE.md ("GitHub Actions runbook") for how to run/watch this manually
# and how to rotate the secrets below.
# Reads Notion via the `ntn` CLI (installed below) using NOTION_API_TOKEN, and
# pushes to GitHub via the Git Data API using a PAT with push access to the
# target repo.
#
# Configuration:
#   Repo VARIABLES (Settings > Secrets and variables > Actions > Variables) —
#   non-secret settings, populated by `bun run setup` (see src/config.ts for the
#   NOTION_SKILLS_* names). config.json is NOT committed; for local dev, copy
#   config.json.example to config.json instead.
#
# Required repo secrets:
#   NOTION_API_TOKEN   - Notion API token (overrides ntn keychain auth)
#   GH_PUSH_TOKEN      - PAT / fine-grained token with contents:write on the
#                        target repo (the default GITHUB_TOKEN can't push to a
#                        different repo)

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: notion-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Secrets
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
      # Non-secret config (repo variables). These replace the committed
      # config.json — see CONFIG_ENV_VARS in src/config.ts.
      NOTION_SKILLS_NOTION_ENV: ${{ vars.NOTION_SKILLS_NOTION_ENV }}
      NOTION_SKILLS_DATA_SOURCE_ID: ${{ vars.NOTION_SKILLS_DATA_SOURCE_ID }}
      NOTION_SKILLS_DATABASE_ID: ${{ vars.NOTION_SKILLS_DATABASE_ID }}
      NOTION_SKILLS_CHANGE_REQUESTS_DATA_SOURCE_ID: ${{ vars.NOTION_SKILLS_CHANGE_REQUESTS_DATA_SOURCE_ID }}
      NOTION_SKILLS_GITHUB_REPO: ${{ vars.NOTION_SKILLS_GITHUB_REPO }}
      NOTION_SKILLS_GITHUB_BRANCH: ${{ vars.NOTION_SKILLS_GITHUB_BRANCH }}
      NOTION_SKILLS_PLUGINS_DIR: ${{ vars.NOTION_SKILLS_PLUGINS_DIR }}
      NOTION_SKILLS_AUTHOR_NAME: ${{ vars.NOTION_SKILLS_AUTHOR_NAME }}
      NOTION_SKILLS_AUTHOR_EMAIL: ${{ vars.NOTION_SKILLS_AUTHOR_EMAIL }}
      NOTION_SKILLS_INJECT_UPDATER: ${{ vars.NOTION_SKILLS_INJECT_UPDATER }}
      NOTION_SKILLS_UPDATER_SLUG: ${{ vars.NOTION_SKILLS_UPDATER_SLUG }}
    steps:
      - uses: actions/checkout@v5

      - name: Install ntn
        run: curl -fsSL https://ntn.dev | bash
        # Installs to /usr/local/bin, already on PATH.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync
        run: bun run src/cli.ts sync
