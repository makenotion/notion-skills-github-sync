name: Sync Notion skills

# Runs the Notion -> plugin marketplace sync on a schedule (and on demand).
# See CLAUDE.md ("GitHub Actions runbook") for how to run/watch this manually
# and how to rotate the secrets below.
# Reads Notion via the `ntn` CLI (installed below) using NOTION_API_TOKEN, and
# pushes to GitHub via the Git Data API using a PAT with push access to the
# target repo.
#
# Required repo secrets:
#   NOTION_API_TOKEN   - Notion API token (overrides ntn keychain auth)
#   GH_PUSH_TOKEN      - PAT / fine-grained token with contents:write on the
#                        target repo (the default GITHUB_TOKEN can't push to a
#                        different repo)
#
# Required repo variables (Settings > Secrets and variables > Actions > Variables):
#   NOTION_ENV                     - Notion environment ("dev" or "prod")
#   SKILLS_DATA_SOURCE_ID          - Skills data source ID
#   SKILLS_DATABASE_ID             - Skills database ID
#   CHANGE_REQUESTS_DATA_SOURCE_ID - Change requests data source ID (optional)
#   TARGET_GITHUB_REPO             - Target repo in "owner/name" format
#   TARGET_GITHUB_BRANCH           - Target branch (e.g., "main")
#   PLUGINS_DIR                    - Directory for plugins (default: "plugins")

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: notion-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install ntn
        run: curl -fsSL https://ntn.dev | bash
        # Installs to /usr/local/bin, already on PATH.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write config.json
        run: |
          cat > config.json << EOF
          {
            "notionEnv": "${{ vars.NOTION_ENV }}",
            "skillsDataSourceId": "${{ vars.SKILLS_DATA_SOURCE_ID }}",
            "skillsDatabaseId": "${{ vars.SKILLS_DATABASE_ID }}",
            "changeRequestsDataSourceId": "${{ vars.CHANGE_REQUESTS_DATA_SOURCE_ID }}",
            "githubRepo": "${{ vars.TARGET_GITHUB_REPO }}",
            "githubBranch": "${{ vars.TARGET_GITHUB_BRANCH }}",
            "pluginsDir": "${{ vars.PLUGINS_DIR || 'plugins' }}"
          }
          EOF

      - name: Sync
        run: bun run src/cli.ts sync
